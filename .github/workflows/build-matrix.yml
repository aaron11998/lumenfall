name: build-matrix
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_roblox_publish:
        description: "Type roblox-publish-main to ALSO run the Open Cloud publish job after the Roblox leg passes"
        required: false
        default: ""

# SECURITY: self-hosted runner on a PUBLIC repo. Only trusted code runs here:
# push-to-main (push-restricted) + manual dispatch. pull_request is NOT wired.
permissions:
  contents: read

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot:
    name: Godot 4.5 matrix (import, smoke, export web)
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    env:
      # Pin the binary AND assert template pairing (4.5.1 <-> 4.5.1.stable;
      # a mismatched templates dir silently exports broken builds).
      GODOT_BIN: /Users/prajwalmendonca/tools/godot-4.5.1/Godot.app/Contents/MacOS/Godot
      GODOT_REQUIRED: "1"
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_PIPELINE_IID: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert engine/template pairing
        run: |
          set -euo pipefail
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable"
          test -x "$GODOT_BIN" || { echo "FAIL: GODOT_BIN missing"; exit 1; }
          test -d "$TEMPLATES_DIR" || { echo "FAIL: 4.5.1.stable templates missing"; exit 1; }
          "$GODOT_BIN" --version

      # build_matrix.sh does its own gated preflight (headless import + smoke
      # marker check), web+macos exports, payload budget, and verdicts.
      # Any FAIL leg => exit 1. A zero-build green run is structurally impossible
      # (godot legs are REQUIRED via GODOT_REQUIRED=1).
      - name: Build matrix (import, smoke, export web+macos)
        run: |
          set -o pipefail
          ./build_matrix.sh 2>&1 | tee matrix_output.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumenfall_main_${{ github.run_number }}
          path: builds/lumenfall_main_${{ github.run_number }}/
          retention-days: 14
          if-no-files-found: error

      - name: Gate summary
        if: always()
        run: grep -E 'BUILD_MATRIX_RESULT|=PASS$|=FAIL$|=SKIP$' matrix_output.log | sort -u || true

  roblox:
    name: Roblox leg (rojo build, luau type-check, TestEZ)
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 5
    env:
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_PIPELINE_IID: ${{ github.run_number }}
      LEGS: roblox
    steps:
      - uses: actions/checkout@v4

      # Lockstep toolchain (rojo 7.7.0 / lune 0.10.5 / luau-lsp 1.70.0 — see
      # docs/ROBLOX_CI.md). A cold runner downloads the pinned archives once
      # and asserts versions; a warm runner verifies in milliseconds.
      - name: Toolchain lockstep (pinned rojo/lune/luau-lsp)
        run: ./scripts_tool/roblox_ci/toolchain_lockstep.sh

      # rojo build -> place file; luau-lsp analyze (strict, roblox defs +
      # rojo sourcemap) -> exit 0 gate; lune TestEZ suite -> PASS marker.
      # Any red step exits nonzero and FAILs the leg.
      - name: Roblox leg (build + analyze + TestEZ)
        run: |
          set -o pipefail
          LEGS=roblox ./build_matrix.sh 2>&1 | tee matrix_roblox.log

      - name: Upload roblox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumenfall_roblox_main_${{ github.run_number }}
          path: builds/lumenfall_main_${{ github.run_number }}/
          retention-days: 14
          if-no-files-found: error

      - name: Gate summary
        if: always()
        run: grep -E 'BUILD_MATRIX_RESULT|roblox=|roblox_leg=' matrix_roblox.log | sort -u || true

  # ------------------------------------------------------------------
  # DISPATCH-ONLY publish gate (AGE-142 deliverable 4).
  # Never runs on push: this job mutates LIVE place state via Open Cloud.
  # Two independent gates must both be true:
  #   1. event is workflow_dispatch (never push/PR)
  #   2. input confirm_roblox_publish == "roblox-publish-main" (explicit)
  # Plus the roblox leg must be green (needs: roblox).
  # Key handling: ROBLOX_OPEN_CLOUD_API_KEY secret is consumed by
  # publish_place.luau from env and never echoed; logs carry statuses only.
  # ------------------------------------------------------------------
  roblox-publish:
    name: Roblox Open Cloud publish (dispatch-only, mutates live place)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_roblox_publish == 'roblox-publish-main'
    needs: roblox
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 5
    environment: roblox-production
    env:
      ROBLOX_REF: ${{ github.ref_name }}
      ROBLOX_BUILDNUM: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain lockstep (pinned rojo/lune/luau-lsp)
        run: ./scripts_tool/roblox_ci/toolchain_lockstep.sh

      # Rebuild before publish: guarantees the uploaded place is exactly the
      # artifact this run verified green (no stale-artifact publishes).
      - name: Roblox leg (build the place to publish)
        run: |
          set -o pipefail
          LEGS=roblox ./build_matrix.sh 2>&1 | tee matrix_roblox.log

      - name: Publish via Open Cloud
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
        run: |
          ./scripts_tool/roblox_ci/tools/lune run scripts_tool/roblox_ci/publish_place.luau 2>&1 | tee publish.log
          grep -q '^PUBLISH_RESULT=OK' publish.log
